<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e323a"/>
      <stop offset="1" stop-color="#23262c"/>
    </linearGradient>
  </defs>

  <!-- 画布 -->
  <rect x="0" y="0" width="840" height="400" rx="18" fill="#16171b"/>

  <!-- 左侧消息 -->
  <rect x="520" y="34" width="286" height="150" rx="14" fill="#1d1f24" stroke="rgba(255,255,255,0.08)"/>
  <text x="540" y="58" font-size="15" fill="#e8e8ea">看下这个文件</text>
  <!-- @chip -->
  <rect x="540" y="70" width="168" height="26" rx="13" fill="#2c3b57"/>
  <text x="556" y="88" font-size="14" fill="#7fb3ff">@剑来收藏卡册.xlsx</text>

  <text x="540" y="132" font-size="12.5" fill="#9a9aa2">点击蓝色 @文件名，右侧滑出预览</text>

  <!-- 右侧预览面板 -->
  <rect x="600" y="150" width="206" height="176" rx="10" fill="#1f2126" stroke="rgba(255,255,255,0.14)"/>
  <line x1="600" y1="176" x2="806" y2="176" stroke="rgba(255,255,255,0.12)"/>
  <text x="614" y="168" font-size="12.5" font-weight="600" fill="#e8e8ea">剑来收藏卡册.xlsx</text>
  <text x="762" y="168" font-size="13" fill="#9a9aa2">×</text>

  <!-- 表格 -->
  <g font-size="11" fill="#cfcfd4">
    <g stroke="rgba(255,255,255,0.16)">
      <rect x="612" y="184" width="182" height="20" fill="rgba(255,255,255,0.07)"/>
      <rect x="612" y="204" width="182" height="16"/>
      <rect x="612" y="220" width="182" height="16"/>
      <rect x="612" y="236" width="182" height="16"/>
      <line x1="612" y1="204" x2="794" y2="204"/>
      <line x1="612" y1="220" x2="794" y2="220"/>
      <line x1="612" y1="236" x2="794" y2="236"/>
      <line x1="690" y1="184" x2="690" y2="252"/>
    </g>
    <text x="620" y="198" fill="#e8e8ea">类型</text><text x="698" y="198">张数</text>
    <text x="620" y="216">AP</text><text x="698" y="216">4</text>
    <text x="620" y="232">SSR</text><text x="698" y="232">2</text>
    <text x="620" y="248">SR</text><text x="698" y="248">18</text>
  </g>

  <!-- 底部输入行 -->
  <line x1="24" y1="318" x2="816" y2="318" stroke="rgba(255,255,255,0.10)"/>

  <!-- 左侧图标：+ 与 权限 -->
  <circle cx="52" cy="352" r="15" fill="#22252b" stroke="rgba(255,255,255,0.22)"/>
  <path d="M52 345v14M45 352h14" stroke="#cfcfd4" stroke-width="2" stroke-linecap="round"/>
  <circle cx="96" cy="352" r="15" fill="#22252b" stroke="rgba(255,255,255,0.22)"/>
  <path d="M96 345.5c-3.2 1.6-5.2 4-6 7.2l6 3.8 6-3.8c-.8-3.2-2.8-5.6-6-7.2Z" fill="#cfcfd4"/>

  <!-- 麦克风（idle） -->
  <circle cx="140" cy="352" r="15" fill="#22252b" stroke="rgba(255,255,255,0.22)"/>
  <path d="M140 345a3.4 3.4 0 0 0-3.4 3.4v5.2a3.4 3.4 0 0 0 6.8 0v-5.2A3.4 3.4 0 0 0 140 345Z" fill="none" stroke="#cfcfd4" stroke-width="2" stroke-linecap="round"/>
  <path d="M146 348.5v2a6 6 0 0 1-12 0v-2M140 356.5v3.5" fill="none" stroke="#cfcfd4" stroke-width="2" stroke-linecap="round"/>

  <!-- 听写胶囊 -->
  <rect x="196" y="336" width="288" height="32" rx="16" fill="url(#pill)" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/>

  <!-- 取消 × -->
  <circle cx="222" cy="352" r="15" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
  <path d="M217 347l10 10M227 347l-10 10" stroke="#e8e8ea" stroke-width="2" stroke-linecap="round"/>

  <!-- 波形（16 条） -->
  <g fill="#e8e8ea">
    <rect x="260" y="348" width="4" height="8" rx="2"/>
    <rect x="268" y="344" width="4" height="16" rx="2" opacity="0.75"/>
    <rect x="276" y="341" width="4" height="22" rx="2"/>
    <rect x="284" y="346" width="4" height="12" rx="2" opacity="0.8"/>
    <rect x="292" y="339" width="4" height="26" rx="2"/>
    <rect x="300" y="345" width="4" height="14" rx="2" opacity="0.85"/>
    <rect x="308" y="341" width="4" height="22" rx="2"/>
    <rect x="316" y="347" width="4" height="10" rx="2" opacity="0.7"/>
    <rect x="324" y="343" width="4" height="18" rx="2" opacity="0.9"/>
    <rect x="332" y="340" width="4" height="24" rx="2"/>
    <rect x="340" y="346" width="4" height="12" rx="2" opacity="0.8"/>
    <rect x="348" y="342" width="4" height="20" rx="2"/>
    <rect x="356" y="338" width="4" height="28" rx="2"/>
    <rect x="364" y="345" width="4" height="14" rx="2" opacity="0.85"/>
    <rect x="372" y="343" width="4" height="18" rx="2" opacity="0.9"/>
    <rect x="380" y="348" width="4" height="8" rx="2"/>
  </g>

  <!-- 停止（五根音量条） -->
  <circle cx="462" cy="352" r="15" fill="none" stroke="#e8e8ea" stroke-width="1.5"/>
  <g stroke="#e8e8ea" stroke-width="2" stroke-linecap="round">
    <path d="M454 355.5v-7"/>
    <path d="M458.5 358.5v-13"/>
    <path d="M463 360.5v-17"/>
    <path d="M467.5 358.5v-13"/>
    <path d="M472 355.5v-7"/>
  </g>

  <text x="24" y="30" font-size="13" fill="#9a9aa2">语音输入：胶囊式听写条（静音 5 秒自动停止）· 发送自动带 @文件名 · 点击 @ 右侧预览</text>
</svg>